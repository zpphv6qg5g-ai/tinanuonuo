            background: #E5E7EB;

            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;

        .question-text {

            color: var(--text-dark);
            margin-bottom: 24px;

        .options-container {
            margin-bottom: 24px;

            align-items: center;
            padding: 12px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option:hover {
            border-color: var(--accent);
            background: var(--neutral);
        }

        .option.selected {
            border-color: var(--primary);
            background: var(--neutral);
        }

        .option input[type="radio"] {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
        }

        .option label {
            cursor: pointer;
            flex: 1;
            font-size: 16px;
            color: var(--text-dark);
        }

        .buttons {

            justify-content: space-between;
            align-items: center;
        }

            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            outline: none;

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {

        .btn-secondary {
            background: #E5E7EB;

        .suggestions li:before {

        .hidden {

                    "关注情绪变化的触发因素，尝试识别并避免这些因素",
                    "学习情绪管理技巧，如认知重构、情绪表达等",
                    "增加社交活动，避免孤独和自我封闭",
                    "考虑寻求专业心理咨询师的帮助，获取更具体的建议"
                ]
            },
            poor: {
                title: "较差",
                description: "您的情绪健康状况可能存在一些问题，经常感到压力、焦虑、抑郁或其他负面情绪。这些感受可能已经对您的日常生活、工作或人际关系产生了明显的影响。",
                suggestions: [
                    "尽快寻求专业心理咨询师或医生的帮助",
                    "与亲友分享您的感受，寻求支持和理解",
                    "避免使用酒精或其他物质来应对情绪问题",
                    "保持规律的生活作息，即使感到困难也要坚持"
                ]
            }
        };

        // DOM元素
        const introSection = document.getElementById('introSection');
        const testSection = document.getElementById('testSection');
        const resultSection = document.getElementById('resultSection');
        const startTestBtn = document.getElementById('startTestBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const questionNumber = document.getElementById('questionNumber');
        const questionCategory = document.getElementById('questionCategory');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const progressFill = document.getElementById('progressFill');
        const saveResultBtn = document.getElementById('saveResultBtn');
        const restartTestBtn = document.getElementById('restartTestBtn');

        // 测试状态
        let currentQuestionIndex = 0;
        const answers = {};

        // 开始测试
        startTestBtn.addEventListener('click', () => {
            introSection.classList.add('hidden');
            testSection.classList.remove('hidden');
            showQuestion(currentQuestionIndex);
            updateProgress();
        });

        // 显示当前问题
        function showQuestion(index) {
            const question = questions[index];
            questionNumber.textContent = index + 1;
            questionCategory.textContent = question.category;
            questionText.textContent = question.text;
            
            // 清空选项容器
            optionsContainer.innerHTML = '';
            
            // 添加选项
            question.options.forEach(option => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                
                if (answers[question.id] === option.value) {
                    optionDiv.classList.add('selected');
                }
                
                const radioInput = document.createElement('input');
                radioInput.type = 'radio';
                radioInput.name = 'question-' + question.id;
                radioInput.value = option.value;
                radioInput.checked = answers[question.id] === option.value;
                
                radioInput.addEventListener('change', () => {
                    answers[question.id] = option.value;
                    document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
                    optionDiv.classList.add('selected');
                });
                
                const label = document.createElement('label');
                label.textContent = option.text;
                
                optionDiv.appendChild(radioInput);
                optionDiv.appendChild(label);
                optionsContainer.appendChild(optionDiv);
            });
            
            // 更新按钮状态
            prevBtn.classList.toggle('hidden', index === 0);
            nextBtn.textContent = index === questions.length - 1 ? '完成测试' : '下一题';
        }

        // 更新进度条
        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            progressFill.style.width = progress + '%';
        }

        // 下一题
        nextBtn.addEventListener('click', () => {
            // 检查是否选择了选项
            if (answers[questions[currentQuestionIndex].id] === undefined) {
                alert('请选择一个选项');
                return;
            }
            
            // 如果是最后一题，显示结果
            if (currentQuestionIndex === questions.length - 1) {
                showResults();
                return;
            }
            
            // 否则显示下一题
            currentQuestionIndex++;
            showQuestion(currentQuestionIndex);
            updateProgress();
        });

        // 上一题
        prevBtn.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion(currentQuestionIndex);
                updateProgress();
            }
        });

        // 显示测试结果
        function showResults() {
            // 计算总分和各类别分数
            let totalScore = 0;
            const categoryScores = {};
            const categoryCounts = {};
            
            questions.forEach(question => {
                const selectedOption = question.options.find(opt => opt.value === answers[question.id]);
                const score = selectedOption ? selectedOption.score : 0;
                totalScore += score;
                
                // 累计类别分数
                if (!categoryScores[question.category]) {
                    categoryScores[question.category] = 0;
                    categoryCounts[question.category] = 0;
                }
                categoryScores[question.category] += score;
                categoryCounts[question.category]++;
            });
            
            // 计算总体健康指数 (0-100)
            const maxTotalScore = questions.reduce((sum, q) => sum + Math.max(...q.options.map(o => o.score)), 0);
            const healthIndex = Math.round((totalScore / maxTotalScore) * 100);
            
            // 确定结果等级
            let resultLevel;
            if (healthIndex >= 80) {
                resultLevel = 'excellent';
            } else if (healthIndex >= 60) {
                resultLevel = 'good';
            } else if (healthIndex >= 40) {
                resultLevel = 'moderate';
            } else {
                resultLevel = 'poor';
            }
            
            const interpretation = resultInterpretations[resultLevel];
            
            // 更新结果显示
            document.getElementById('totalScore').textContent = healthIndex;
            
            const resultGrade = document.getElementById('resultGrade');
            resultGrade.textContent = interpretation.title;
            resultGrade.className = `result-grade grade-${resultLevel}`;
            
            // 显示类别结果
            const resultCategories = document.getElementById('resultCategories');
            resultCategories.innerHTML = '';
            
            Object.keys(categoryScores).forEach(category => {
                const maxCategoryScore = categoryCounts[category] * 4; // 假设最高分为4分
                const categoryPercentage = Math.round((categoryScores[category] / maxCategoryScore) * 100);
                
                const categoryCard = document.createElement('div');
                categoryCard.className = 'category-card';
                categoryCard.innerHTML = `
                    <div class="category-title">${category}</div>
                    <div class="category-score">${categoryPercentage}%</div>
                    <div class="category-bar">
                        <div class="category-bar-fill" style="width: ${categoryPercentage}%; background: ${getScoreColor(categoryPercentage)}"></div>
                    </div>
                `;
                resultCategories.appendChild(categoryCard);
            });
            
            // 显示结果解读
            document.getElementById('resultInterpretation').innerHTML = `
                <h3>结果解读</h3>
                <p>${interpretation.description}</p>
            `;
            
            // 显示建议
            const suggestionsList = document.getElementById('resultSuggestions').querySelector('ul');
            suggestionsList.innerHTML = '';
            interpretation.suggestions.forEach(suggestion => {
                const li = document.createElement('li');
                li.textContent = suggestion;
                suggestionsList.appendChild(li);
            });
            
            // 如果分数很低，添加紧急建议
            if (healthIndex < 40) {
                const emergencyLi = document.createElement('li');
                emergencyLi.style.color = 'var(--danger)';
                emergencyLi.style.fontWeight = 'bold';
                emergencyLi.textContent = '请注意：如果您有自杀或自伤的念头，请立即寻求专业帮助或拨打心理危机干预热线。';
                suggestionsList.appendChild(emergencyLi);
            }
            
            // 切换到结果页面
            testSection.classList.add('hidden');
            resultSection.classList.remove('hidden');
        }

        // 根据分数获取颜色
        function getScoreColor(score) {
            if (score >= 80) return '#10B981'; // 绿色
            if (score >= 60) return '#3B82F6'; // 蓝色
            if (score >= 40) return '#F59E0B'; // 黄色
            return '#EF4444'; // 红色
        }

        // 保存结果
        saveResultBtn.addEventListener('click', () => {
            const resultText = `情绪健康测试结果：
得分：${document.getElementById('totalScore').textContent}/100
等级：${document.getElementById('resultGrade').textContent}

${document.getElementById('resultInterpretation').textContent}

建议：
${Array.from(document.getElementById('resultSuggestions').querySelectorAll('li'))
    .map(li => li.textContent)
    .join('\n')}

注意：本测试结果仅供参考，不能替代专业医疗诊断。`;
            
            // 尝试复制到剪贴板
            if (navigator.clipboard) {
                navigator.clipboard.writeText(resultText).then(() => {
                    alert('结果已复制到剪贴板！');
                }).catch(() => {
                    // 如果复制失败，显示文本让用户手动复制
                    prompt('请复制以下结果：', resultText);
                });
            } else {
                // 不支持剪贴板API，显示文本让用户手动复制
                prompt('请复制以下结果：', resultText);
            }
        });

        // 重新测试
        restartTestBtn.addEventListener('click', () => {
            // 重置测试状态
            currentQuestionIndex = 0;
            Object.keys(answers).forEach(key => delete answers[key]);
            
            // 重置UI
            resultSection.classList.add('hidden');
            introSection.classList.remove('hidden');
            progressFill.style.width = '0%';
        });
    </script>
</body>
</html>
