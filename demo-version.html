                ]
            }

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);
        let scores = new Array(questions.length).fill(0);

        // 开始测试
        function startTest() {
            document.querySelector('.glass-effect').classList.add('hidden');
            document.getElementById('test-container').classList.remove('hidden');
            showQuestion(currentQuestion);
        }

        // 显示问题
        function showQuestion(index) {
            const question = questions[index];
            document.getElementById('question-number').textContent = `问题 ${index + 1}/${questions.length}`;
            document.getElementById('question-text').textContent = question.text;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            question.options.forEach((option, i) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = `flex items-center p-4 border rounded-lg cursor-pointer transition-colors duration-200 ${answers[index] === option.value ? 'bg-primary/10 border-primary' : 'border-gray-200 hover:bg-gray-50'}`;
                optionDiv.onclick = () => selectOption(option.value, option.score);
                
                optionDiv.innerHTML = `
                    <div class="flex items-center justify-center w-6 h-6 rounded-full border-2 ${answers[index] === option.value ? 'border-primary bg-primary text-white' : 'border-gray-300'} mr-3">
                        ${answers[index] === option.value ? '<i class="fa fa-check text-sm"></i>' : ''}
                    </div>
                    <span class="text-gray-700">${option.text}</span>
                `;
                
                optionsContainer.appendChild(optionDiv);
            });

            // 更新进度条
            const progress = ((index + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // 更新按钮状态
            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').textContent = index === questions.length - 1 ? '完成测试' : '下一题';
            document.getElementById('next-btn').innerHTML = index === questions.length - 1 ? 
                '<i class="fa fa-check mr-2"></i>完成测试' : '下一题<i class="fa fa-arrow-right ml-2"></i>';
        }

        // 选择选项
        function selectOption(value, score) {
            answers[currentQuestion] = value;
            scores[currentQuestion] = score;
            showQuestion(currentQuestion);
        }

        // 上一题
        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion(currentQuestion);
            }
        }

        // 下一题
        function nextQuestion() {
            if (answers[currentQuestion] === null) {
                alert('请选择一个选项');
                return;
            }

            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                showQuestion(currentQuestion);
            } else {
                showResult();
            }
        }

        // 显示结果
        function showResult() {
            document.getElementById('test-container').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');

            const totalScore = scores.reduce((sum, score) => sum + score, 0);
            document.getElementById('total-score').textContent = totalScore;

            // 根据分数确定结果
            let resultTitle, resultIcon, resultColor, resultDetails, resultAdvice;

            if (totalScore <= 10) {
                resultTitle = "情绪状态良好";
                resultIcon = '<i class="fa fa-smile-o"></i>';
                resultColor = 'bg-green-100 text-green-600 border-green-200';
                resultDetails = `
                    <p class="mb-4">您的情绪健康状况良好，继续保持积极的生活态度和健康的生活方式。</p>

                        <li>积极的生活态度</li>
                        <li>良好的心理韧性</li>
                    </ul>
                `;

                    <ul class="space-y-2 text-gray-700">
                        <li class="flex items-start">
                            <i class="fa fa-check-circle text-green-500 mt-1 mr-2"></i>
                            <span>继续保持规律的作息和健康的生活习惯</span>
                        </li>
                        <li class="flex items-start">
                            <i class="fa fa-check-circle text-green-500 mt-1 mr-2"></i>
                            <span>定期进行自我反思和情绪觉察</span>
                        </li>
                        <li class="flex items-start">
                            <i class="fa fa-check-circle text-green-500 mt-1 mr-2"></i>
                            <span>培养兴趣爱好，丰富生活内容</span>
                        </li>
                    </ul>
                `;
            } else if (totalScore <= 25) {
                resultTitle = "轻度情绪困扰";
                resultIcon = '<i class="fa fa-meh-o"></i>';
                resultColor = 'bg-yellow-100 text-yellow-600 border-yellow-200';
                resultDetails = `
                    <p class="mb-4">您可能正经历轻度的情绪困扰，这在生活中是比较常见的。适当的调整可以帮助您改善情绪状态。</p>
                    <h4 class="font-semibold text-gray-800 mb-2">需要关注的方面：</h4>
                    <ul class="list-disc list-inside text-gray-700 space-y-1">
                        <li>情绪波动可能较为明显</li>
                        <li>可能存在一定的压力或焦虑</li>
                        <li>睡眠或食欲可能受到影响</li>
                    </ul>
                `;
                resultAdvice = `
                    <h4 class="font-semibold text-gray-800 mb-3">建议：</h4>
                    <ul class="space-y-2 text-gray-700">
                        <li class="flex items-start">
                            <i class="fa fa-check-circle text-blue-500 mt-1 mr-2"></i>
                            <span>学习简单的情绪调节技巧，如深呼吸、冥想等</span>
                        </li>
                        <li class="flex items-start">
                            <i class="fa fa-check-circle text-blue-500 mt-1 mr-2"></i>
                            <span>保持规律的运动，有助于释放压力</span>
                        </li>
                        <li class="flex items-start">
                            <i class="fa fa-check-circle text-blue-500 mt-1 mr-2"></i>
                            <span>与亲友分享您的感受，寻求情感支持</span>
                        </li>
                        <li class="flex items-start">
                            <i class="fa fa-check-circle text-blue-500 mt-1 mr-2"></i>
                            <span>如果困扰持续，考虑寻求专业心理咨询</span>
                        </li>
                    </ul>
                `;

                resultIcon = '<i class="fa fa-frown-o"></i>';
                resultColor = 'bg-orange-100 text-orange-600 border-orange-200';
                resultDetails = `

                        <li>情绪低落或焦虑较为明显</li>
                        <li>可能影响到工作效率和人际关系</li>
                        <li>睡眠、食欲等生理功能可能受到影响</li>
                    </ul>
                `;
                resultAdvice = `
                    <h4 class="font-semibold text-gray-800 mb-3">建议：</h4>
                    <ul class="space-y-2 text-gray-700">
                        <li class="flex items-start">
                            <i class="fa fa-exclamation-circle text-orange-500 mt-1 mr-2"></i>
                            <span><strong>建议寻求专业心理咨询师的帮助</strong></span>
                        </li>
                        <li class="flex items-start">
                            <i class="fa fa-check-circle text-blue-500 mt-1 mr-2"></i>
                            <span>建立规律的生活作息，保证充足睡眠</span>
                        </li>
                        <li class="flex items-start">
                            <i class="fa fa-check-circle text-blue-500 mt-1 mr-2"></i>
                            <span>避免过度工作或压力，学会合理安排时间</span>
                        </li>
                        <li class="flex items-start">
                            <i class="fa fa-check-circle text-blue-500 mt-1 mr-2"></i>
                            <span>与信任的人分享您的感受和困扰</span>
                        </li>
                    </ul>
                `;
            } else {
                resultTitle = "重度情绪困扰";
                resultIcon = '<i class="fa fa-sad-tear"></i>';
                resultColor = 'bg-red-100 text-red-600 border-red-200';
                resultDetails = `
                    <p class="mb-4">您可能正经历较为严重的情绪困扰，这需要高度重视并及时寻求专业帮助。</p>
                    <h4 class="font-semibold text-gray-800 mb-2">需要立即关注的问题：</h4>
                    <ul class="list-disc list-inside text-gray-700 space-y-1">
                        <li>持续的情绪低落或焦虑</li>
                        <li>可能存在消极思维或行为</li>
                        <li>日常生活功能可能受到明显影响</li>
                    </ul>
                `;
                resultAdvice = `
                    <h4 class="font-semibold text-gray-800 mb-3">紧急建议：</h4>
                    <ul class="space-y-2 text-gray-700">
                        <li class="flex items-start">
                            <i class="fa fa-exclamation-triangle text-red-500 mt-1 mr-2"></i>
                            <span><strong>请立即寻求专业心理健康服务</strong></span>
                        </li>
                        <li class="flex items-start">
                            <i class="fa fa-phone text-blue-500 mt-1 mr-2"></i>
                            <span>心理危机干预热线：400-161-9995（北京）</span>
                        </li>
                        <li class="flex items-start">
                            <i class="fa fa-user-md text-blue-500 mt-1 mr-2"></i>
                            <span>尽快预约心理医生或精神科医生</span>
                        </li>
                        <li class="flex items-start">
                            <i class="fa fa-users text-blue-500 mt-1 mr-2"></i>
                            <span>不要独自面对，寻求亲友的陪伴和支持</span>
                        </li>
                    </ul>
                `;
            }

            document.getElementById('result-title').textContent = resultTitle;
            document.getElementById('result-icon').className = `${resultColor} inline-flex items-center justify-center w-20 h-20 rounded-full mb-4 text-3xl`;
            document.getElementById('result-icon').innerHTML = resultIcon;
            document.getElementById('result-details').innerHTML = resultDetails;
            document.getElementById('result-advice').innerHTML = resultAdvice;
        }

        // 保存结果
        function saveResult() {
            const totalScore = scores.reduce((sum, score) => sum + score, 0);
            const resultData = {
                score: totalScore,
                answers: answers,
                scores: scores,
                timestamp: new Date().toISOString()
            };
            
            try {
                localStorage.setItem('emotionalHealthTestResult', JSON.stringify(resultData));
                alert('测试结果已保存到本地！');
            } catch (error) {
                alert('保存失败，请手动记录您的测试结果。');
            }
        }

        // 重新测试
        function restartTest() {
            currentQuestion = 0;
            answers = new Array(questions.length).fill(null);
            scores = new Array(questions.length).fill(0);
            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('test-container').classList.remove('hidden');
            showQuestion(currentQuestion);
        }

        // 返回演示
        function backToDemo() {
            document.getElementById('result-container').classList.add('hidden');
            document.querySelector('.glass-effect').classList.remove('hidden');
        }

        // 复制链接
        function copyLink() {
            const linkText = document.getElementById('demo-link').textContent;
            navigator.clipboard.writeText(linkText).then(() => {
                alert('链接已复制到剪贴板！');
            }).catch(err => {
                alert('复制失败，请手动复制。');
            });
        }

        // 添加键盘导航支持
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('test-container').classList.contains('hidden')) return;
            
            if (e.key === 'ArrowLeft') {
                if (currentQuestion > 0) {
                    prevQuestion();
                }
            } else if (e.key === 'ArrowRight') {
                if (answers[currentQuestion] !== null) {
                    if (currentQuestion < questions.length - 1) {
                        nextQuestion();
                    } else {
                        showResult();
                    }
                }
            }
        });

        // 添加页面加载动画
        window.addEventListener('load', function() {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            
            setTimeout(function() {
                document.body.style.opacity = '1';
            }, 100);
        });
    </script>
</body>
</html>
